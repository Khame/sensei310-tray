[package]
name = "sensei310-tray"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "KDE tray controller for SteelSeries Sensei 310 (DPI, RGB, polling rate)"
repository = "https://github.com/khame/sensei310-tray"
readme = "README.md"
categories = ["command-line-utilities", "desktop-environment", "hardware-support"]
keywords = ["steelseries", "sensei310", "rgb", "dpi", "kde", "tray", "statusnotifier"]

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.with-debug]
inherits = "release"
debug = true
split-debuginfo = "packed"